<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Create New Post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <div class="inner">
            <a class="brand" href="{{ url_for('index') }}">
                <div class="logo">P</div>
                <div><strong>Bonnyrigg Pizza Blog</strong></div>
            </a>
            <nav>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </nav>
        </div>
    </header>
    
    <main class="container">
        <div class="form-box">
            <h2>Create New Pizza Post</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <ul>
                        {% for c,m in messages %}
                            <li style="color:{% if c=='error' %}red{% else %}green{% endif %};">{{ m }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}
            
            <form method="POST" enctype="multipart/form-data">
                <!-- CSRF PROTECTION - Prevents cross-site request forgery attacks -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                
                <div class="form-row">
                    <label>Pizza Title</label>
                    <input type="text" name="title" required>
                </div>
                
                <div class="form-row">
                    <label>Description</label>
                    <textarea name="content" rows="4" required></textarea>
                </div>
                
                <div class="form-row">
                    <label>Ingredients (one per line)</label>
                    <textarea name="ingredients" rows="5" placeholder="Tomatoes&#10;Mozzarella&#10;Basil" required></textarea>
                </div>
                
                <div class="form-row">
                    <label>Instructions (one per line)</label>
                    <textarea name="instructions" rows="5" placeholder="1. Prepare dough&#10;2. Add toppings&#10;3. Bake" required></textarea>
                </div>
                
                <div class="form-row">
                    <label>Pizza Image</label>
                    <input type="file" name="image" accept="image/*" required>
                </div>
                
                <div style="margin-top:12px">
                    <button class="btn-primary" type="submit">Create Post</button>
                    <a href="{{ url_for('dashboard') }}" class="btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
